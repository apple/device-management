title: Status Account List CalDAV
description: The status item that lists the devices's Calendar accounts.
payload:
  statusitemtype: account.list.caldav
  supportedOS:
    iOS:
      introduced: '16.0'
      allowed-enrollments:
      - supervised
      - device
      - user
      - local
      allowed-scopes:
      - system
      sharedipad:
        allowed-scopes:
        - user
    macOS:
      introduced: '13.0'
      allowed-enrollments:
      - supervised
      - user
      - local
      allowed-scopes:
      - user
    tvOS:
      introduced: n/a
    visionOS:
      introduced: '1.1'
      allowed-enrollments:
      - supervised
      - device
      - user
      - local
      allowed-scopes:
      - system
    watchOS:
      introduced: n/a
payloadkeys:
- key: account.list.caldav
  title: Status item value.
  type: <array>
  presence: required
  content: A list of status values for the Calendar accounts.
  subkeytype: Account
  subkeys:
  - key: status_value
    title: Status value
    type: <dictionary>
    content: A Calendar account.
    subkeys:
    - key: identifier
      title: Unique identifier of the account.
      type: <string>
      presence: required
      content: The unique identifier for the account.
    - key: _removed
      title: Indicates removal of the account.
      type: <boolean>
      presence: optional
      default: false
      content: If `true`, the device has removed the account and the status item object
        only contains this key and the `identifier` key.
    - key: declaration-identifier
      title: Identifier of the declaration that installed the account.
      type: <string>
      presence: optional
      content: The identifier of the declaration that installed the account. Only
        present if a declaration installed the account.
    - key: visible-name
      title: Account name
      type: <string>
      presence: optional
      content: The name of the account.
    - key: hostname
      title: Account hostname
      type: <string>
      presence: optional
      content: The server host name for the account.
    - key: port
      title: Server port
      type: <integer>
      presence: optional
      content: The server port for the account.
    - key: username
      title: Account username
      type: <string>
      presence: optional
      content: The user name for the account.
    - key: are-calendars-enabled
      title: Are calendars enabled
      type: <boolean>
      presence: optional
      content: If `true`, the Calendar app is displaying calendars and events for
        the account.
    - key: are-reminders-enabled
      title: Are reminders enabled
      type: <boolean>
      presence: optional
      content: If `true`, the Reminders app is displaying reminders for the account.
examples:
- title: Status item example
  files:
  - tab: New or updated account
    description: Reports a new or updated account.
    file: data/docc-examples/remotemanagementmodel/status/account.list.caldav/example1.json
  - tab: Removed account
    description: Reports a removed account.
    file: data/docc-examples/remotemanagementmodel/status/account.list.caldav/example2.json
