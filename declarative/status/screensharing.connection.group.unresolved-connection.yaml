title: Status Screen Sharing Connection Group Unresolved Connections
description: The status item that lists connection groups with member connection references
  that the device couldn't resolve.
payload:
  statusitemtype: screensharing.connection.group.unresolved-connection
  supportedOS:
    iOS:
      introduced: n/a
    macOS:
      introduced: '14.1'
      allowed-enrollments:
      - supervised
      - user
      - local
      allowed-scopes:
      - system
      - user
    tvOS:
      introduced: n/a
    visionOS:
      introduced: n/a
    watchOS:
      introduced: n/a
payloadkeys:
- key: screensharing.connection.group.unresolved-connection
  title: Connection groups status
  type: <array>
  presence: required
  content: The status item that contains an array of unresolved connection groups.
  subkeytype: UnresolvedGroup
  subkeys:
  - key: unresolved_group
    title: Unresolved group
    type: <dictionary>
    content: The status item that contains an unresolved connection group.
    subkeys:
    - key: identifier
      title: Unique identifier of the connection group.
      type: <string>
      presence: required
      content: The unique `ConnectionGroupUUID` identifier of the connection group.
    - key: _removed
      title: Indicates removal of the unresolved connection group.
      type: <boolean>
      presence: optional
      default: false
      content: If `true`, the system removed the unresolved connection group and only
        this key and the `identifier` key are present in the status item object.
    - key: unresolved_connections
      title: Unique identifiers of unresolved connections.
      type: <array>
      presence: optional
      content: An array of `ConnectionUUID` values specified in the `Members` key
        in the group's declaration for the unresolved connections.
      subkeys:
      - key: ConnectionUUID
        title: Connection unique identifier
        type: <string>
        content: The unique identifier (i.e., ConnectionUUID) of a connection which
          could not be resolved.
examples:
  title: Status item example
  files:
  - tab: New or updated connection group
    description: Reports a new or updated connection group.
    file: data/docc-examples/remotemanagementmodel/status/screensharing.connection.group.unresolved-connection/example1.json
  - tab: Removed connection group
    description: Reports a removed connection group.
    file: data/docc-examples/remotemanagementmodel/status/screensharing.connection.group.unresolved-connection/example2.json
