title: Status Enhanced Logging Non-Interactive Eligibility
description: The status item that reports whether the device is eligible to run a
  non-interactive enhanced log collection session.
payload:
  statusitemtype: enhanced-logging.noninteractive-eligibility
  supportedOS:
    iOS:
      introduced: '27.2'
      allowed-enrollments:
      - supervised
      allowed-scopes:
      - system
      sharedipad:
        allowed-scopes:
        - system
    macOS:
      introduced: '27.2'
      allowed-enrollments:
      - supervised
      allowed-scopes:
      - user
    tvOS:
      introduced: '27.2'
      allowed-enrollments:
      - supervised
      allowed-scopes:
      - system
    visionOS:
      introduced: n/a
    watchOS:
      introduced: n/a
payloadkeys:
- key: enhanced-logging.noninteractive-eligibility
  title: Status item value.
  type: <boolean>
  presence: required
  content: If `true`, the device is eligible to run a non-interactive enhanced log
    collection session.
examples:
- title: Status item example
  files:
  - file: examples/declarative/status/enhanced-logging.noninteractive-eligibility/example1.json
