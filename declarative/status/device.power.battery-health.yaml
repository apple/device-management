title: Status Device Battery Health
description: The status item that reports the device's battery health.
payload:
  statusitemtype: device.power.battery-health
  supportedOS:
    iOS:
      introduced: '17.0'
      allowed-enrollments:
      - supervised
      - device
      - local
      allowed-scopes:
      - system
      sharedipad:
        allowed-scopes:
        - system
    macOS:
      introduced: '14.4'
      allowed-enrollments:
      - supervised
      - local
      allowed-scopes:
      - system
    tvOS:
      introduced: n/a
    visionOS:
      introduced: n/a
    watchOS:
      introduced: n/a
payloadkeys:
- key: device.power.battery-health
  title: Status item value.
  type: <string>
  presence: required
  rangelist:
  - non-genuine
  - normal
  - service-recommended
  - unknown
  - unsupported
  content: |-
    The battery health status, which has the following values:

    - `non-genuine`: The battery isn't a genuine Apple battery.
    - `normal`: The battery is operating normally.
    - `service-recommended`: The system recommends battery service.
    - `unknown`: The system couldn't determine battery health information.
    - `unsupported`: The device doesn't support battery health reporting.

    Supported on iPhones, specific iPad models, and Mac computers with Apple silicon.
notes:
- title: ''
  content: |-
    For more information about battery health, see the following support articles:

    - [iPhone devices](https://support.apple.com/101575)
    - [iPad devices](https://support.apple.com/117759)
    - [macOS devices](https://support.apple.com/108376)
examples:
- title: Status item example
  files:
  - file: examples/declarative/status/device.power.battery-health/example1.json
