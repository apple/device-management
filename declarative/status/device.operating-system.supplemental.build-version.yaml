title: Status Device Operating System Supplemental Build Version
description: The status item that reports the device's operating system supplemental
  build version and Background Security Improvement version.
payload:
  statusitemtype: device.operating-system.supplemental.build-version
  supportedOS:
    iOS:
      introduced: '16.1'
      allowed-enrollments:
      - supervised
      - device
      - user
      - local
      allowed-scopes:
      - system
      sharedipad:
        allowed-scopes:
        - system
        - user
    macOS:
      introduced: '13.0'
      allowed-enrollments:
      - supervised
      - user
      - local
      allowed-scopes:
      - system
      - user
    tvOS:
      introduced: '16.1'
      allowed-enrollments:
      - supervised
      - device
      - local
      allowed-scopes:
      - system
    visionOS:
      introduced: '1.1'
      allowed-enrollments:
      - supervised
      - device
      - user
      - local
      allowed-scopes:
      - system
    watchOS:
      introduced: '10.0'
      allowed-enrollments:
      - supervised
      - local
      allowed-scopes:
      - system
payloadkeys:
- key: device.operating-system.supplemental.build-version
  title: Status item value.
  type: <string>
  presence: required
  content: The operating system's build and Background Security Improvement versions
    in use on the device, for example, `20A123a` or `20B27c`.
examples:
- title: Status item example
  files:
  - file: examples/declarative/status/device.operating-system.supplemental.build-version/example1.json
