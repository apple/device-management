title: Status Account List Exchange
description: The status item that lists the devices's Exchange accounts.
payload:
  statusitemtype: account.list.exchange
  supportedOS:
    iOS:
      introduced: '16.0'
      allowed-enrollments:
      - supervised
      - device
      - user
      - local
      allowed-scopes:
      - system
      sharedipad:
        allowed-scopes:
        - user
    macOS:
      introduced: '13.0'
      allowed-enrollments:
      - supervised
      - user
      - local
      allowed-scopes:
      - user
    tvOS:
      introduced: n/a
    visionOS:
      introduced: '1.1'
      allowed-enrollments:
      - supervised
      - device
      - user
      - local
      allowed-scopes:
      - system
    watchOS:
      introduced: n/a
payloadkeys:
- key: account.list.exchange
  title: Status item value.
  type: <array>
  presence: required
  content: A list of status values for the Exchange accounts.
  subkeytype: Account
  subkeys:
  - key: status_value
    title: Status value
    type: <dictionary>
    content: An Exchange account.
    subkeys:
    - key: identifier
      title: Unique identifier of the account.
      type: <string>
      presence: required
      content: The unique identifier for the account.
    - key: _removed
      title: Indicates removal of the account.
      type: <boolean>
      presence: optional
      default: false
      content: If `true`, the device has removed the account and the status item object
        only contains this key and the `identifier` key.
    - key: declaration-identifier
      title: Identifier of the declaration that installed the account.
      type: <string>
      presence: optional
      content: The identifier of the declaration that installed the account. Only
        present if a declaration installed the account.
    - key: visible-name
      title: Account name
      type: <string>
      presence: optional
      content: The name of the account.
    - key: protocol-type
      title: Exchange protocol type
      supportedOS:
        iOS:
          introduced: '27.3'
        macOS:
          introduced: '27.3'
        visionOS:
          introduced: '27.3'
      type: <string>
      presence: optional
      rangelist:
      - EAS
      - EWS
      - Graph
      content: |-
        The protocol the account uses to communicate with the Exchange server, with the following possible values:

        - `EAS`: Exchange ActiveSync
        - `EWS`: Exchange Web Services
        - `Graph`: Microsoft Graph API
    - key: graph-migration-state
      title: Graph migration state
      supportedOS:
        iOS:
          introduced: n/a
        macOS:
          introduced: '27.3'
        visionOS:
          introduced: n/a
      type: <dictionary>
      presence: optional
      content: The state of this account's data migration from Exchange Web Services
        to the Microsoft Graph API. Each key is only present when the device reports
        a migration state for the corresponding data.
      subkeytype: GraphMigrationState
      subkeys:
      - key: mail
        title: Mail migration state
        type: <string>
        presence: optional
        rangelist:
        - eligible
        - converting
        - syncing
        - migrated
        - skipped
        - failed
        content: |-
          The state of this account's Mail data migration, which has the following values:

          - `eligible`: The account is eligible to migrate, and the migration hasn't started.
          - `converting`: The account is offline while the device converts its data in place.
          - `syncing`: The device is synchronizing the account with the Microsoft Graph API.
          - `migrated`: The migration completed successfully.
          - `skipped`: The account has no data to convert, so the migration can't run.
          - `failed`: The migration failed, and the device re-downloads the account's data.
      - key: contacts
        title: Contacts migration state
        type: <string>
        presence: optional
        rangelist:
        - eligible
        - converting
        - syncing
        - migrated
        - skipped
        - failed
        content: |-
          The state of this account's Contacts data migration, which has the following values:

          - `eligible`: The account is eligible to migrate, and the migration hasn't started.
          - `converting`: The account is offline while the device converts its data in place.
          - `syncing`: The device is synchronizing the account with the Microsoft Graph API.
          - `migrated`: The migration completed successfully.
          - `skipped`: The account has no data to convert, so the migration can't run.
          - `failed`: The migration failed, and the device re-downloads the account's data.
      - key: other
        title: Other data migration state
        type: <string>
        presence: optional
        rangelist:
        - eligible
        - converting
        - syncing
        - migrated
        - skipped
        - failed
        content: |-
          The state of this account's Calendars, Reminders, and Notes data migration, which has the following values:

          - `eligible`: The account is eligible to migrate, and the migration hasn't started.
          - `converting`: The account is offline while the device converts its data in place.
          - `syncing`: The device is synchronizing the account with the Microsoft Graph API.
          - `migrated`: The migration completed successfully.
          - `skipped`: The account has no data to convert, so the migration can't run.
          - `failed`: The migration failed, and the device re-downloads the account's data.
    - key: graph-support
      title: Graph support
      supportedOS:
        iOS:
          introduced: n/a
        macOS:
          introduced: '27.3'
        visionOS:
          introduced: n/a
      type: <string>
      presence: optional
      rangelist:
      - unknown
      - supported
      - unsupported
      content: |-
        Indicates if the account's mailbox supports the Microsoft Graph API. This key is present only for an account that uses Exchange Web Services. The support has the following values:

        - `unknown`: The device hasn't classified the mailbox.
        - `supported`: The mailbox supports the Microsoft Graph API.
        - `unsupported`: The mailbox doesn't support the Microsoft Graph API.

        The device can reclassify a mailbox later, so `unsupported` isn't permanent.
    - key: hostname
      title: Account hostname
      type: <string>
      presence: optional
      content: The server host name for the account.
    - key: port
      title: Server port
      type: <integer>
      presence: optional
      content: The server port for the account.
    - key: username
      title: Account username
      type: <string>
      presence: optional
      content: The user name for the account.
    - key: is-mail-enabled
      title: Is mail enabled
      type: <boolean>
      presence: optional
      content: A Boolean value that indicates whether the Mail app displays mail for
        this account.
    - key: are-calendars-enabled
      title: Are calendars enabled
      type: <boolean>
      presence: optional
      content: A Boolean value that indicates whether the Calendar app displays calendars
        and events for this account.
    - key: are-contacts-enabled
      title: Are contacts enabled
      type: <boolean>
      presence: optional
      content: A Boolean value that indicates whether the Contacts app displays contacts
        for this account.
    - key: are-notes-enabled
      title: Are notes enabled
      type: <boolean>
      presence: optional
      content: A Boolean value that indicates whether the Notes app displays notes
        for this account.
    - key: are-reminders-enabled
      title: Are reminders enabled
      type: <boolean>
      presence: optional
      content: A Boolean value that indicates whether the Reminders app displays reminders
        for this account.
examples:
- title: Status item example
  files:
  - tab: New or updated account
    description: Reports a new or updated account.
    file: examples/declarative/status/account.list.exchange/example1.json
  - tab: Removed account
    description: Reports a removed account.
    file: examples/declarative/status/account.list.exchange/example2.json
