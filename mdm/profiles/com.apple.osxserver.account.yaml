title: macOS Server Account
description: The payload that configures a macOS Server account.
payload:
  payloadtype: com.apple.osxserver.account
  supportedOS:
    iOS:
      introduced: '9.0'
      deprecated: '12.0'
      removed: '12.0'
      multiple: true
      supervised: false
      allowmanualinstall: true
      sharedipad:
        mode: forbidden
      userenrollment:
        mode: forbidden
    macOS:
      introduced: n/a
    tvOS:
      introduced: n/a
    visionOS:
      introduced: n/a
    watchOS:
      introduced: n/a
payloadkeys:
- key: HostName
  title: Account hostname
  type: <string>
  presence: required
  content: The server's address.
- key: UserName
  title: Account username
  type: <string>
  presence: required
  content: The user's user name.
- key: Password
  title: Account password
  type: <string>
  presence: optional
  content: The user's password.
- key: AccountDescription
  title: Account description
  type: <string>
  presence: optional
  content: The description of the account.
- key: ConfiguredAccounts
  title: Configured accounts
  type: <array>
  presence: required
  content: An array of dictionaries containing configured account types and relevant
    settings
  subkeys:
  - key: ConfiguredAccountsItem
    title: Configured account
    type: <dictionary>
    subkeys:
    - key: Type
      title: Account type
      type: <string>
      presence: required
      rangelist:
      - com.apple.osxserver.documents
      content: com.apple.osxserver.documents (the Documents account type).
    - key: Port
      title: Port number
      type: <integer>
      presence: optional
      content: Designates the port number to use when contacting the server. If no
        port number is specified, the default port is used.
