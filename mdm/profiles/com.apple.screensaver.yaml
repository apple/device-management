title: Screensaver
description: The payload that configures the screen saver.
payload:
  payloadtype: com.apple.screensaver
  supportedOS:
    iOS:
      introduced: n/a
    macOS:
      introduced: '10.11'
      multiple: false
      devicechannel: true
      userchannel: false
      requiresdep: false
      userapprovedmdm: false
      allowmanualinstall: true
      userenrollment:
        mode: forbidden
    tvOS:
      introduced: n/a
    visionOS:
      introduced: n/a
    watchOS:
      introduced: n/a
  content: Specifies grace period for screensaver locking
payloadkeys:
- key: askForPassword
  supportedOS:
    macOS:
      introduced: '10.13'
  type: <boolean>
  presence: optional
  default: false
  content: If `true`, the device prompts the user for a password when the screen saver
    is unlocked or stopped. When you use this prompt, you must also provide `askForPasswordDelay`.
- key: askForPasswordDelay
  supportedOS:
    macOS:
      introduced: '10.13'
  type: <integer>
  presence: optional
  content: The number of seconds to delay before the device requires a password to
    unlock or stop the screen saver (the grace period). A value of `2147483647` (hexadecimal
    equivalent of `0x7FFFFFFF`) disables this requirement, and a value of `0` immediately
    requires the password. To use this option, you must set `askForPassword` to `true`.
- key: idleTime
  type: <integer>
  presence: optional
  content: The number of seconds of inactivity before the screen saver activates (0
    = Never activate).
- key: loginWindowModulePath
  type: <string>
  presence: optional
  content: The full path to the screen-saver module to use.
- key: moduleName
  type: <string>
  presence: required
  content: The name of the screen saver module.
examples:
- title: Profile example
  files:
  - file: examples/mdm/profiles/com.apple.screensaver/example1.plist
