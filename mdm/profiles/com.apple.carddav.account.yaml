title: CardDAV
description: The payload that configures a Contacts account.
payload:
  payloadtype: com.apple.carddav.account
  supportedOS:
    iOS:
      introduced: '4.0'
      multiple: true
      supervised: false
      allowmanualinstall: true
      sharedipad:
        mode: allowed
        devicechannel: false
        userchannel: true
      userenrollment:
        mode: allowed
    macOS:
      introduced: '10.7'
      multiple: true
      devicechannel: false
      userchannel: true
      supervised: false
      requiresdep: false
      userapprovedmdm: false
      allowmanualinstall: true
      userenrollment:
        mode: allowed
    tvOS:
      introduced: n/a
    visionOS:
      introduced: '1.1'
      multiple: true
      supervised: false
      allowmanualinstall: true
      userenrollment:
        mode: allowed
    watchOS:
      introduced: n/a
payloadkeys:
- key: CardDAVAccountDescription
  title: Account description
  supportedOS:
    macOS:
      introduced: '10.7'
  type: <string>
  presence: optional
  content: The description of the account.
- key: CardDAVHostName
  title: Account hostname
  supportedOS:
    macOS:
      introduced: '10.7'
  type: <string>
  presence: required
  content: The server's address.
- key: CardDAVUsername
  title: Account username
  supportedOS:
    macOS:
      introduced: '10.7'
  type: <string>
  presence: optional
  content: The user name for logins.
- key: CardDAVPassword
  title: Account password
  supportedOS:
    macOS:
      introduced: '10.7'
  type: <string>
  presence: optional
  content: The user's password. Only use this in encrypted profiles.
- key: CardDAVPrincipalURL
  title: Principal URL
  supportedOS:
    macOS:
      introduced: n/a
  type: <string>
  presence: optional
  content: The base URL to the user's address book.
- key: CardDAVUseSSL
  title: Use SSL
  supportedOS:
    macOS:
      introduced: '10.7'
  type: <boolean>
  presence: optional
  default: true
  content: If `true`, the system enables SSL.
- key: CardDAVPort
  title: Port number
  supportedOS:
    macOS:
      introduced: '10.7'
  type: <integer>
  presence: optional
  content: The server's port.
- key: CommunicationServiceRules
  title: Communication service rules
  supportedOS:
    iOS:
      introduced: '10.0'
    macOS:
      introduced: n/a
  type: <dictionary>
  presence: optional
  content: An array of communication service rules for this account.
  subkeys:
  - key: DefaultServiceHandlers
    title: Default service handlers
    supportedOS:
      iOS:
        introduced: '10.0'
      macOS:
        introduced: n/a
    type: <dictionary>
    presence: optional
    content: A dictionary of service handlers for contacts from this account.
    subkeys:
    - key: AudioCall
      title: App for audio calls
      supportedOS:
        iOS:
          introduced: '10.0'
        macOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The bundle identifier for the default application that handles audio
        calls to contacts from this account.
- key: VPNUUID
  title: VPNUUID
  supportedOS:
    iOS:
      introduced: '14.0'
    macOS:
      introduced: n/a
  type: <string>
  presence: optional
  content: The VPNUUID of the per-app VPN the account uses for network communication.
examples:
- title: Profile example
  files:
  - file: examples/mdm/profiles/com.apple.carddav.account/example1.plist
