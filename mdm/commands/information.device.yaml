title: Device Information Command
description: Get detailed information about a device.
payload:
  requesttype: DeviceInformation
  supportedOS:
    iOS:
      introduced: '4.0'
      accessrights: Special Case
      supervised: false
      requiresdep: false
      sharedipad:
        mode: allowed
        devicechannel: true
        userchannel: true
      userenrollment:
        mode: allowed
    macOS:
      introduced: '10.7'
      accessrights: Special Case
      devicechannel: true
      userchannel: true
      supervised: false
      requiresdep: false
      userenrollment:
        mode: allowed
    tvOS:
      introduced: '9.0'
      accessrights: Special Case
      supervised: false
    visionOS:
      introduced: '1.1'
      accessrights: Special Case
      supervised: false
      requiresdep: false
      userenrollment:
        mode: allowed
    watchOS:
      introduced: '10.0'
      accessrights: Special Case
      supervised: false
  content: This command allows the server to query for specific device information.
    It's supported in the user channel.
payloadkeys:
- key: Queries
  type: <array>
  presence: required
  content: An array of query dictionaries to get information about a device.
  subkeys:
  - key: QueriesItem
    type: <string>
    content: A query dictionary to get information about a device.
    subkeys:
    - key: UDID
      supportedOS:
        iOS:
          accessrights: n/a
          userenrollment:
            mode: forbidden
        macOS:
          accessrights: n/a
          userenrollment:
            mode: forbidden
        tvOS:
          accessrights: n/a
        visionOS:
          accessrights: n/a
          userenrollment:
            mode: forbidden
        watchOS:
          accessrights: n/a
      type: <string>
      presence: optional
      content: The key to get the unique identifier of the device.
    - key: ProvisioningUDID
      supportedOS:
        iOS:
          introduced: n/a
        macOS:
          introduced: '11.3'
          accessrights: n/a
          userenrollment:
            mode: forbidden
        tvOS:
          introduced: n/a
        visionOS:
          introduced: n/a
        watchOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The key to get the device identifier for provisioning profiles. This
        value differs from the UDID for a Mac with Apple silicon.
    - key: OrganizationInfo
      supportedOS:
        iOS:
          introduced: '7.0'
          accessrights: n/a
        macOS:
          introduced: '10.11'
        tvOS:
          introduced: '9.0'
          accessrights: n/a
        visionOS:
          accessrights: n/a
        watchOS:
          accessrights: n/a
      type: <string>
      presence: optional
      content: The key to get the contents of `OrganizationInfo`.
    - key: MDMOptions
      supportedOS:
        iOS:
          introduced: '7.0'
          accessrights: n/a
        macOS:
          introduced: '11.0'
        tvOS:
          introduced: '9.0'
          accessrights: n/a
        visionOS:
          accessrights: n/a
        watchOS:
          introduced: '10.0'
      type: <string>
      presence: optional
      content: The key to get the contents of `MDMOptions`.
    - key: LastCloudBackupDate
      supportedOS:
        iOS:
          introduced: '8.0'
          userenrollment:
            mode: forbidden
        macOS:
          introduced: n/a
        tvOS:
          introduced: n/a
        visionOS:
          userenrollment:
            mode: forbidden
        watchOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The key to get the date of the most-recent iCloud backup.
    - key: AwaitingConfiguration
      supportedOS:
        iOS:
          introduced: '9.0'
          accessrights: n/a
          userenrollment:
            mode: forbidden
        macOS:
          introduced: '10.11'
          accessrights: n/a
          userenrollment:
            mode: forbidden
        tvOS:
          introduced: '10.2'
          accessrights: n/a
        visionOS:
          introduced: '2.0'
          userenrollment:
            mode: forbidden
        watchOS:
          accessrights: n/a
      type: <string>
      presence: optional
      content: The key to determine whether the device is waiting for a `Device-Configured-Command`
        command or `User-Configured-Command` command to continue through Setup Assistant
        on the device channel or user channel, respectively.
    - key: iTunesStoreAccountIsActive
      supportedOS:
        iOS:
          introduced: '7.0'
          accessrights: AllowAppInstallation
          userenrollment:
            mode: forbidden
        macOS:
          introduced: '10.9'
          accessrights: AllowAppInstallation
          userenrollment:
            mode: forbidden
        tvOS:
          introduced: '9.0'
          accessrights: AllowAppInstallation
        visionOS:
          introduced: n/a
        watchOS:
          accessrights: AllowAppInstallation
      type: <string>
      presence: optional
      content: The key to determine whether the iTunes Store account is active. Requires
        the App Installation access right.
    - key: iTunesStoreAccountHash
      supportedOS:
        iOS:
          introduced: '8.0'
          accessrights: AllowAppInstallation
          userenrollment:
            mode: forbidden
        macOS:
          introduced: '10.10'
          accessrights: AllowAppInstallation
          userenrollment:
            mode: forbidden
        tvOS:
          introduced: '9.0'
          accessrights: AllowAppInstallation
        visionOS:
          introduced: n/a
        watchOS:
          accessrights: AllowAppInstallation
      type: <string>
      presence: optional
      content: The key to get a hash of the logged-in iTunes Store account. Also see
        `GetVppUserRequest`. Requires the App Installation access right.
    - key: DeviceName
      supportedOS:
        iOS:
          accessrights: AllowQueryDeviceInformation
        macOS:
          accessrights: AllowQueryDeviceInformation
        tvOS:
          accessrights: AllowQueryDeviceInformation
        visionOS:
          accessrights: AllowQueryDeviceInformation
        watchOS:
          accessrights: AllowQueryDeviceInformation
      type: <string>
      presence: optional
      content: The key to get the device name. Requires the Device Information access
        right.
    - key: OSVersion
      supportedOS:
        iOS:
          accessrights: AllowQueryDeviceInformation
        macOS:
          accessrights: AllowQueryDeviceInformation
        tvOS:
          accessrights: AllowQueryDeviceInformation
        visionOS:
          accessrights: AllowQueryDeviceInformation
        watchOS:
          accessrights: AllowQueryDeviceInformation
      type: <string>
      presence: optional
      content: The key to get the operating system version. Requires the Device Information
        access right.
    - key: SupplementalOSVersionExtra
      supportedOS:
        iOS:
          introduced: '16.1'
          accessrights: AllowQueryDeviceInformation
        macOS:
          introduced: '13.0'
          accessrights: AllowQueryDeviceInformation
        tvOS:
          introduced: '16.1'
          accessrights: AllowQueryDeviceInformation
        visionOS:
          accessrights: AllowQueryDeviceInformation
        watchOS:
          accessrights: AllowQueryDeviceInformation
      type: <string>
      presence: optional
      content: The key to get the OS update Background Security Improvement version
        letter, if a Background Security Improvement update is installed. Requires
        the Device Information access right.
    - key: BuildVersion
      supportedOS:
        iOS:
          accessrights: AllowQueryDeviceInformation
        macOS:
          accessrights: AllowQueryDeviceInformation
        tvOS:
          accessrights: AllowQueryDeviceInformation
        visionOS:
          accessrights: AllowQueryDeviceInformation
        watchOS:
          accessrights: AllowQueryDeviceInformation
      type: <string>
      presence: optional
      content: The key to get the operating system version. Requires the Device Information
        access right.
    - key: SupplementalBuildVersion
      supportedOS:
        iOS:
          introduced: '16.1'
          accessrights: AllowQueryDeviceInformation
        macOS:
          introduced: '13.0'
          accessrights: AllowQueryDeviceInformation
        tvOS:
          introduced: '16.1'
          accessrights: AllowQueryDeviceInformation
        visionOS:
          accessrights: AllowQueryDeviceInformation
        watchOS:
          accessrights: AllowQueryDeviceInformation
      type: <string>
      presence: optional
      content: The key to get the build version for the currently installed Background
        Security Improvement. If there's no installed Background Security Improvement,
        this value is the same as `BuildVersion`. Requires the Device Information
        access right.
    - key: ModelName
      supportedOS:
        iOS:
          accessrights: AllowQueryDeviceInformation
        macOS:
          accessrights: AllowQueryDeviceInformation
        tvOS:
          accessrights: AllowQueryDeviceInformation
        visionOS:
          accessrights: AllowQueryDeviceInformation
        watchOS:
          accessrights: AllowQueryDeviceInformation
      type: <string>
      presence: optional
      content: The key to get the model name, such as _iPhone_. Requires the Device
        Information access right.
    - key: Model
      supportedOS:
        iOS:
          accessrights: AllowQueryDeviceInformation
        macOS:
          accessrights: AllowQueryDeviceInformation
        tvOS:
          accessrights: AllowQueryDeviceInformation
        visionOS:
          introduced: n/a
        watchOS:
          accessrights: AllowQueryDeviceInformation
      type: <string>
      presence: optional
      content: The key to get the model. Requires the Device Information access right.
    - key: ModelNumber
      supportedOS:
        iOS:
          introduced: '16.4'
          accessrights: AllowQueryDeviceInformation
        macOS:
          introduced: '13.3'
          accessrights: AllowQueryDeviceInformation
        tvOS:
          introduced: '16.4'
          accessrights: AllowQueryDeviceInformation
        visionOS:
          accessrights: AllowQueryDeviceInformation
        watchOS:
          accessrights: AllowQueryDeviceInformation
      type: <string>
      presence: optional
      content: The key to get the device's hardware model number, including region
        info, such as `MK1A3LL/A`. Requires the Device Information access right. Requires
        a Mac with Apple silicon for macOS.
    - key: IsAppleSilicon
      supportedOS:
        iOS:
          introduced: n/a
        macOS:
          introduced: '12.0'
          accessrights: AllowQueryDeviceInformation
        tvOS:
          introduced: n/a
        visionOS:
          introduced: n/a
        watchOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The key to determine whether the device is a Mac with Apple silicon
        (for example, an Apple M1 chip).
    - key: ProductName
      supportedOS:
        iOS:
          accessrights: AllowQueryDeviceInformation
        macOS:
          accessrights: AllowQueryDeviceInformation
        tvOS:
          accessrights: AllowQueryDeviceInformation
        visionOS:
          accessrights: AllowQueryDeviceInformation
        watchOS:
          accessrights: AllowQueryDeviceInformation
      type: <string>
      presence: optional
      content: The key to get the product name, such as _iPad8,12_. Requires the Device
        Information access right.
    - key: SerialNumber
      supportedOS:
        iOS:
          accessrights: AllowQueryDeviceInformation
          userenrollment:
            mode: forbidden
        macOS:
          accessrights: AllowQueryDeviceInformation
          userenrollment:
            mode: forbidden
        tvOS:
          accessrights: AllowQueryDeviceInformation
        visionOS:
          accessrights: AllowQueryDeviceInformation
          userenrollment:
            mode: forbidden
        watchOS:
          accessrights: AllowQueryDeviceInformation
      type: <string>
      presence: optional
      content: The key to get the serial number. Requires the Device Information access
        right.
    - key: DeviceCapacity
      supportedOS:
        iOS:
          accessrights: AllowQueryDeviceInformation
        macOS:
          accessrights: AllowQueryDeviceInformation
        tvOS:
          introduced: n/a
        visionOS:
          accessrights: AllowQueryDeviceInformation
        watchOS:
          accessrights: AllowQueryDeviceInformation
      type: <string>
      presence: optional
      content: The key to get the device's total capacity. Requires the Device Information
        access right.
    - key: AvailableDeviceCapacity
      supportedOS:
        iOS:
          accessrights: AllowQueryDeviceInformation
        macOS:
          accessrights: AllowQueryDeviceInformation
        tvOS:
          introduced: n/a
        visionOS:
          accessrights: AllowQueryDeviceInformation
        watchOS:
          accessrights: AllowQueryDeviceInformation
      type: <string>
      presence: optional
      content: The key to get the available capacity. Requires the Device Information
        access right.
    - key: IMEI
      supportedOS:
        iOS:
          deprecated: '16.0'
          removed: '26.0'
          accessrights: AllowQueryDeviceInformation
          userenrollment:
            mode: forbidden
        macOS:
          introduced: n/a
        tvOS:
          introduced: n/a
        visionOS:
          introduced: n/a
        watchOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The key to get the International Mobile Equipment Identity (IMEI) number.
        Requires the Device Information access right. Available as of iOS 4 and deprecated
        in iOS 16.
    - key: MEID
      supportedOS:
        iOS:
          deprecated: '16.0'
          removed: '26.0'
          accessrights: AllowQueryDeviceInformation
          userenrollment:
            mode: forbidden
        macOS:
          introduced: n/a
        tvOS:
          introduced: n/a
        visionOS:
          introduced: n/a
        watchOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The key to get the mobile equipment ID (MEID). Requires the Device
        Information access right. Available as of iOS 4 and deprecated in iOS 16.
    - key: ModemFirmwareVersion
      supportedOS:
        iOS:
          accessrights: AllowQueryDeviceInformation
          userenrollment:
            mode: forbidden
        macOS:
          introduced: n/a
        tvOS:
          introduced: n/a
        visionOS:
          introduced: n/a
        watchOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The key to get the modem firmware version. Requires the Device Information
        access right.
    - key: CellularTechnology
      supportedOS:
        iOS:
          introduced: 4.2.6
          accessrights: AllowQueryDeviceInformation
        macOS:
          introduced: n/a
        tvOS:
          introduced: n/a
        visionOS:
          introduced: n/a
        watchOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The key to get the cellular technology type. Requires the Device Information
        access right.
    - key: BatteryLevel
      supportedOS:
        iOS:
          introduced: '5.0'
          accessrights: AllowQueryDeviceInformation
        macOS:
          introduced: '13.3'
          accessrights: AllowQueryDeviceInformation
        tvOS:
          introduced: n/a
        visionOS:
          accessrights: AllowQueryDeviceInformation
        watchOS:
          accessrights: AllowQueryDeviceInformation
      type: <string>
      presence: optional
      content: The key to get the battery level. Requires the Device Information access
        right.
    - key: HasBattery
      supportedOS:
        iOS:
          introduced: n/a
        macOS:
          introduced: '13.3'
          accessrights: AllowQueryDeviceInformation
        tvOS:
          introduced: n/a
        visionOS:
          introduced: n/a
        watchOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The key to determine whether the device has an internal battery.
    - key: IsSupervised
      supportedOS:
        iOS:
          introduced: '6.0'
          accessrights: AllowQueryDeviceInformation
        macOS:
          introduced: '10.15'
        tvOS:
          introduced: '9.0'
          accessrights: AllowQueryDeviceInformation
        visionOS:
          accessrights: AllowQueryDeviceInformation
        watchOS:
          accessrights: AllowQueryDeviceInformation
      type: <string>
      presence: optional
      content: The key to determine whether the device is supervised. Requires the
        Device Information access right.
    - key: IsMultiUser
      supportedOS:
        iOS:
          introduced: '9.3'
          accessrights: AllowQueryDeviceInformation
        macOS:
          introduced: n/a
        tvOS:
          introduced: n/a
        visionOS:
          introduced: n/a
        watchOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The key to determine whether the device is a Shared iPad. Requires
        the Device Information access right.
    - key: IsDeviceLocatorServiceEnabled
      supportedOS:
        iOS:
          introduced: '7.0'
          accessrights: AllowQueryDeviceInformation
        macOS:
          introduced: n/a
        tvOS:
          introduced: n/a
        visionOS:
          accessrights: AllowQueryDeviceInformation
        watchOS:
          accessrights: AllowQueryDeviceInformation
      type: <string>
      presence: optional
      content: The key to determine whether the system enabled a device locator service
        such as Find My on the device. Requires the Device Information access right.
    - key: IsActivationLockEnabled
      supportedOS:
        iOS:
          introduced: '7.0'
          deprecated: '16.0'
          accessrights: AllowQueryDeviceInformation
          userenrollment:
            mode: forbidden
        macOS:
          introduced: '10.15'
          deprecated: '13.0'
          accessrights: AllowQueryDeviceInformation
          userenrollment:
            mode: forbidden
        tvOS:
          introduced: n/a
        visionOS:
          introduced: n/a
        watchOS:
          deprecated: '10.0'
          accessrights: AllowQueryDeviceInformation
      type: <string>
      presence: optional
      content: The key to determine whether the system enabled Activation Lock on
        the device. Requires the Device Information access right. Available as of
        iOS 7 and macOS 10.15, and deprecated in iOS 16 and macOS 13.
    - key: IsActivationLockSupported
      supportedOS:
        iOS:
          introduced: n/a
        macOS:
          introduced: '10.15'
          accessrights: AllowQueryDeviceInformation
          userenrollment:
            mode: forbidden
        tvOS:
          introduced: n/a
        visionOS:
          introduced: n/a
        watchOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The key to determine whether the device supports Activation Lock. Also
        see `IsActivationLockManageable` in `ManagementStatus`.
    - key: IsDoNotDisturbInEffect
      supportedOS:
        iOS:
          introduced: '7.0'
          accessrights: AllowQueryDeviceInformation
          userenrollment:
            mode: forbidden
        macOS:
          introduced: n/a
        tvOS:
          introduced: n/a
        visionOS:
          accessrights: AllowQueryDeviceInformation
          userenrollment:
            mode: forbidden
        watchOS:
          accessrights: AllowQueryDeviceInformation
      type: <string>
      presence: optional
      content: The key to determine whether the device is in Do Not Disturb (DND)
        mode. Requires the Device Information access right.
    - key: DeviceID
      supportedOS:
        iOS:
          introduced: n/a
        macOS:
          introduced: n/a
        tvOS:
          introduced: '9.0'
          accessrights: AllowQueryDeviceInformation
        visionOS:
          introduced: n/a
        watchOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The key to get the device ID. Requires the Device Information access
        right.
    - key: EASDeviceIdentifier
      supportedOS:
        iOS:
          introduced: '7.0'
          accessrights: AllowQueryDeviceInformation
        macOS:
          introduced: n/a
        tvOS:
          introduced: n/a
        visionOS:
          accessrights: AllowQueryDeviceInformation
        watchOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The key to get the device identifier for Exchange ActiveSync (EAS).
        Requires the Device Information access right.
    - key: IsCloudBackupEnabled
      supportedOS:
        iOS:
          introduced: '7.1'
          accessrights: AllowQueryDeviceInformation
          userenrollment:
            mode: forbidden
        macOS:
          introduced: n/a
        tvOS:
          introduced: n/a
        visionOS:
          accessrights: AllowQueryDeviceInformation
          userenrollment:
            mode: forbidden
        watchOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The key to determine whether the system enabled iCloud Backup on the
        device. Requires the Device Information access right.
    - key: ActiveManagedUsers
      supportedOS:
        iOS:
          introduced: n/a
        macOS:
          introduced: '10.11'
          accessrights: AllowQueryDeviceInformation
          userchannel: false
        tvOS:
          introduced: n/a
        visionOS:
          introduced: n/a
        watchOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The key to get an array of directory GUIDs for logged-in managed users.
        Requires the Device Information access right.
    - key: OSUpdateSettings
      supportedOS:
        iOS:
          introduced: n/a
        macOS:
          introduced: '10.11'
          deprecated: '26.0'
          removed: '27.0'
          accessrights: AllowQueryDeviceInformation
          userenrollment:
            mode: forbidden
        tvOS:
          introduced: n/a
        visionOS:
          introduced: n/a
        watchOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The key to get the contents of `OSUpdateSettings`. Requires the Device
        Information access right.
    - key: LocalHostName
      supportedOS:
        iOS:
          introduced: n/a
        macOS:
          introduced: '10.11'
          accessrights: AllowQueryDeviceInformation
        tvOS:
          introduced: n/a
        visionOS:
          introduced: n/a
        watchOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The key to get the local hostname from Bonjour.
    - key: HostName
      supportedOS:
        iOS:
          introduced: n/a
        macOS:
          introduced: '10.11'
          accessrights: AllowQueryDeviceInformation
        tvOS:
          introduced: n/a
        visionOS:
          introduced: n/a
        watchOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The key to get the hostname.
    - key: AutoSetupAdminAccounts
      supportedOS:
        iOS:
          introduced: n/a
        macOS:
          introduced: '10.11'
          accessrights: AllowQueryDeviceInformation
          requiresdep: true
          userenrollment:
            mode: forbidden
        tvOS:
          introduced: n/a
        visionOS:
          introduced: n/a
        watchOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The key to get the contents of `AutoSetupAdminAccountsItem`, which
        Setup Assistant automatically creates during enrollment. Requires the Device
        Information access right.
    - key: SystemIntegrityProtectionEnabled
      supportedOS:
        iOS:
          introduced: n/a
        macOS:
          introduced: '10.12'
          accessrights: AllowQueryDeviceInformation
        tvOS:
          introduced: n/a
        visionOS:
          introduced: n/a
        watchOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The key to determine whether the system enabled System Integrity Protection
        on the device. Requires the Device Information access right, and is available
        in macOS 10.12 and later.
    - key: SupportsLOMDevice
      supportedOS:
        iOS:
          introduced: n/a
        macOS:
          introduced: '11.0'
          accessrights: AllowQueryDeviceInformation
        tvOS:
          introduced: n/a
        visionOS:
          introduced: n/a
        watchOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The key to determine whether the device can receive `PowerON`, `PowerOFF`,
        and `Reset` commands from a lights-out management (LOM) controller.
    - key: IsMDMLostModeEnabled
      supportedOS:
        iOS:
          introduced: '9.3'
          accessrights: AllowQueryDeviceInformation
          userenrollment:
            mode: forbidden
        macOS:
          introduced: n/a
        tvOS:
          introduced: n/a
        visionOS:
          introduced: n/a
        watchOS:
          accessrights: AllowQueryDeviceInformation
      type: <string>
      presence: optional
      content: The key to determine whether the system enabled Managed Lost Mode on
        the device. Requires the Device Information access right.
    - key: MaximumResidentUsers
      supportedOS:
        iOS:
          introduced: '9.3'
          accessrights: AllowQueryDeviceInformation
          supervised: true
          requiresdep: true
          sharedipad:
            mode: required
            devicechannel: true
            userchannel: false
          userenrollment:
            mode: forbidden
        macOS:
          introduced: n/a
        tvOS:
          introduced: n/a
        visionOS:
          introduced: n/a
        watchOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The key to get the maximum number of users that can use this Shared
        iPad device. In iOS 13.4 and later, this value is always `32`. Requires the
        Device Information access right.
    - key: EstimatedResidentUsers
      supportedOS:
        iOS:
          introduced: '14.0'
          accessrights: AllowQueryDeviceInformation
          supervised: true
          requiresdep: true
          sharedipad:
            mode: required
            devicechannel: true
            userchannel: false
          userenrollment:
            mode: forbidden
        macOS:
          introduced: n/a
        tvOS:
          introduced: n/a
        visionOS:
          introduced: n/a
        watchOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The key to get the estimated number of users that can use this Shared
        iPad device, according to the available space of the device and each user's
        quota. Requires the Device Information access right.
    - key: QuotaSize
      supportedOS:
        iOS:
          introduced: '13.4'
          accessrights: AllowQueryDeviceInformation
          supervised: true
          requiresdep: true
          sharedipad:
            mode: required
            devicechannel: true
            userchannel: false
          userenrollment:
            mode: forbidden
        macOS:
          introduced: n/a
        tvOS:
          introduced: n/a
        visionOS:
          introduced: n/a
        watchOS:
          introduced: n/a
      type: <string>
      presence: optional
      content: The key to get the quota size for each user on this Shared iPad device.
        Requires the Device Information access right.
    - key: ResidentUsers
